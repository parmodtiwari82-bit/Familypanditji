name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate staging smoke-test script
        run: |
          bash -n scripts/staging_smoke_test.sh
          if BASE_URL="http://localhost.attacker.example" bash scripts/staging_smoke_test.sh; then
            echo "Unsafe lookalike localhost host was accepted." >&2
            exit 1
          fi
          if BASE_URL="http://staging.example.com" bash scripts/staging_smoke_test.sh; then
            echo "Plain HTTP staging host was accepted." >&2
            exit 1
          fi
      - name: Set up Node.js for frontend validation
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate frontend JavaScript syntax
        run: bash scripts/check_frontend.sh
      - name: Validate religious content catalogues
        run: python scripts/validate_content.py
      - name: Run API tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q ../tests

  container-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build production container image
        run: docker build --tag ai-family-pandit-ji:ci .

      - name: Run container and verify bundled JPL engine through Family Pandit Ji API
        run: |
          docker run --detach --name ai-family-pandit-ji-ci --publish 8000:8000 ai-family-pandit-ji:ci
          cleanup() {
            docker rm --force ai-family-pandit-ji-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          healthy=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              healthy=1
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' ai-family-pandit-ji-ci 2>/dev/null | grep -q true; then
              echo "Container exited before becoming healthy."
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::group::Container logs"
            docker logs ai-family-pandit-ji-ci || true
            echo "::endgroup::"
            docker inspect ai-family-pandit-ji-ci --format '{{json .State}}' || true
            exit 1
          fi
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:8000"
          with urlopen(base + "/api/astronomy/status", timeout=10) as response:
              status = json.load(response)
          assert status["jpl_ready"] is True, status

          birth = {
              "birth_date": "1982-01-01",
              "birth_time": "00:30",
              "latitude": 26.4499,
              "longitude": 80.3319,
              "timezone": "Asia/Kolkata",
              "engine": "auto",
          }
          request = Request(
              base + "/api/kundli/calculate",
              data=json.dumps(birth).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=30) as response:
              chart = json.load(response)
          assert chart["engine"]["id"] == "jpl_de440s_skyfield", chart.get("engine")
          assert len(chart["planets"]) == 9, chart.get("planets")
          assert chart["data_retention"] == "not_stored_by_this_endpoint"
          print("JPL API smoke test passed:", chart["engine"]["id"], chart["lagna"]["rashi"])
          PY

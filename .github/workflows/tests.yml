name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate staging smoke-test script
        run: |
          bash -n scripts/staging_smoke_test.sh
          if BASE_URL="http://localhost.attacker.example" bash scripts/staging_smoke_test.sh; then
            echo "Unsafe lookalike localhost host was accepted." >&2
            exit 1
          fi
          if BASE_URL="http://staging.example.com" bash scripts/staging_smoke_test.sh; then
            echo "Plain HTTP staging host was accepted." >&2
            exit 1
          fi
      - name: Set up Node.js for frontend validation
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate frontend JavaScript syntax
        run: bash scripts/check_frontend.sh
      - name: Validate religious content catalogues\n        run: python scripts/validate_content.py\n      - name: Run API tests\n        working-directory: backend
        run: PYTHONPATH=. pytest -q ../tests

  container-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build production container image
        run: docker build --tag ai-family-pandit-ji:ci .
